<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Layanan - HomeFix</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <div class="container-fluid">
    <div class="row">
      <!-- Sidebar -->
      <nav class="col-md-3 col-lg-2 sidebar">
        <div class="p-3">
          <h4 class="text-center">HomeFix</h4>
          <ul class="nav flex-column">
            <li class="nav-item">
              <a class="nav-link" href="dashboard.html"><i class="fas fa-tachometer-alt me-2"></i> Dashboard</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" href="#"><i class="fas fa-tools me-2"></i> Layanan</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="orders.html"><i class="fas fa-shopping-cart me-2"></i> Pesanan Saya</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="history.html"><i class="fas fa-history me-2"></i> Riwayat</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="profile.html"><i class="fas fa-user me-2"></i> Profil</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="../index.html"><i class="fas fa-home me-2"></i> Beranda</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#" onclick="logout()"><i class="fas fa-sign-out-alt me-2"></i> Logout</a>
            </li>
          </ul>
        </div>
      </nav>

      <!-- Main Content -->
      <main class="col-md-9 col-lg-10 main-content">
        <!-- Top Navbar -->
        <nav class="navbar navbar-expand-lg navbar-light bg-white mb-4">
          <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">Layanan</span>
          </div>
        </nav>

        <!-- Services Grid -->
        <div id="servicesContainer" class="row">
          <!-- Services will be loaded dynamically -->
        </div>
      </main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Load services from API
    async function loadServices() {
      try {
        const response = await fetch('http://localhost:3000/api/services');
        const services = await response.json();

        const container = document.getElementById('servicesContainer');
        container.innerHTML = '';

        services.forEach(service => {
          const serviceCard = createServiceCard(service);
          container.appendChild(serviceCard);
        });
      } catch (error) {
        console.error('Error loading services:', error);
        document.getElementById('servicesContainer').innerHTML =
          '<div class="col-12"><div class="alert alert-danger">Error loading services. Please try again later.</div></div>';
      }
    }

    function createServiceCard(service) {
      const colDiv = document.createElement('div');
      colDiv.className = 'col-md-4 mb-4';

      const cardDiv = document.createElement('div');
      cardDiv.className = 'card service-card h-100';

      const imageDiv = document.createElement('img');
      imageDiv.src = service.image;
      imageDiv.className = 'card-img-top';
      imageDiv.alt = service.name;
      imageDiv.style.height = '200px';
      imageDiv.style.objectFit = 'cover';

      const cardBody = document.createElement('div');
      cardBody.className = 'card-body text-center';

      const categoryBadge = document.createElement('span');
      categoryBadge.className = 'badge bg-primary mb-2';
      categoryBadge.textContent = service.category;

      const title = document.createElement('h5');
      title.className = 'card-title';
      title.textContent = service.name;

      const description = document.createElement('p');
      description.className = 'card-text';
      description.textContent = service.description;

      const price = document.createElement('p');
      price.className = 'card-text';
      price.innerHTML = `<strong>${service.price}</strong>`;

      const duration = document.createElement('p');
      duration.className = 'card-text';
      duration.innerHTML = `<small class="text-muted"><i class="fas fa-clock me-1"></i>${service.duration}</small>`;

      const featuresList = document.createElement('ul');
      featuresList.className = 'list-unstyled mb-3';
      service.features.forEach(feature => {
        const li = document.createElement('li');
        li.innerHTML = `<small><i class="fas fa-check text-success me-1"></i>${feature}</small>`;
        featuresList.appendChild(li);
      });

      const orderButton = document.createElement('button');
      orderButton.className = 'btn btn-primary';
      orderButton.textContent = 'Pesan Sekarang';
      orderButton.onclick = () => orderService(service.name);

      cardBody.appendChild(categoryBadge);
      cardBody.appendChild(title);
      cardBody.appendChild(description);
      cardBody.appendChild(price);
      cardBody.appendChild(duration);
      cardBody.appendChild(featuresList);
      cardBody.appendChild(orderButton);

      cardDiv.appendChild(imageDiv);
      cardDiv.appendChild(cardBody);
      colDiv.appendChild(cardDiv);

      return colDiv;
    }

    function orderService(serviceName) {
      alert(`Memesan layanan: ${serviceName}. Mengarahkan ke halaman pemesanan...`);
      window.location.href = 'order.html?service=' + encodeURIComponent(serviceName);
    }

    function logout() {
      if (confirm('Apakah Anda yakin ingin logout?')) {
        window.location.href = '../index.html';
      }
    }

    // Load services when page loads
    document.addEventListener('DOMContentLoaded', loadServices);
  </script>
</body>
</html>
