<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register User - HomeFix</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link rel="stylesheet" href="../style.css">
</head>
<body class="auth-background">
  <div class="register-container">
    <h2><i class="fas fa-user-plus"></i> Register User</h2>
    <form id="registerForm">
      <div class="mb-3">
        <label for="fullName" class="form-label">Nama Lengkap</label>
        <input type="text" class="form-control" id="fullName" required>
      </div>
      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input type="email" class="form-control" id="email" required>
      </div>
      <div class="mb-3">
        <label for="phone" class="form-label">Nomor Telepon</label>
        <input type="tel" class="form-control" id="phone" required>
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <input type="password" class="form-control" id="password" required>
      </div>
      <div class="mb-3">
        <label for="confirmPassword" class="form-label">Konfirmasi Password</label>
        <input type="password" class="form-control" id="confirmPassword" required>
      </div>
      <div class="mb-3">
        <label for="address" class="form-label">Alamat</label>
        <textarea class="form-control" id="address" rows="3" required></textarea>
      </div>
      <div class="mb-3 form-check">
        <input type="checkbox" class="form-check-input" id="terms" required>
        <label class="form-check-label" for="terms">
          Saya menyetujui <a href="#" target="_blank">Syarat dan Ketentuan</a> serta <a href="#" target="_blank">Kebijakan Privasi</a>
        </label>
      </div>
      <button type="submit" class="btn btn-primary">Daftar</button>
    </form>
    <div class="register-link">
      <p>Sudah punya akun? <a href="login.html">Login sekarang</a></p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    document.getElementById('registerForm').addEventListener('submit', async function(e) {
      e.preventDefault();

      const fullName = document.getElementById('fullName').value;
      const email = document.getElementById('email').value;
      const phone = document.getElementById('phone').value;
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const address = document.getElementById('address').value;
      const terms = document.getElementById('terms').checked;

      // Basic validation
      if (password !== confirmPassword) {
        alert('Password dan konfirmasi password tidak cocok.');
        return;
      }

      if (!terms) {
        alert('Silakan setujui syarat dan ketentuan.');
        return;
      }

      if (!fullName || !email || !phone || !password || !address) {
        alert('Silakan lengkapi semua field.');
        return;
      }

      try {
        const response = await fetch('http://localhost:8000/api/auth/register', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            fullName,
            email,
            phone,
            password,
            address
          })
        });

        const data = await response.json();

        if (response.ok) {
          alert('Registrasi berhasil! Mengarahkan ke login...');
          window.location.href = 'login.html';
        } else {
          alert(data.error || 'Terjadi kesalahan saat registrasi');
        }
      } catch (error) {
        console.error('Registration error:', error);
        alert('Terjadi kesalahan koneksi. Silakan coba lagi.');
      }
    });
  </script>
</body>
</html>
