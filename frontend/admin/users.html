<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kelola Pengguna - HomeFix Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <div class="container-fluid">
    <div class="row">
      <!-- Sidebar -->
      <nav class="col-md-3 col-lg-2 sidebar">
        <div class="p-3">
          <h4 class="text-center">HomeGuard Services Admin</h4>
          <ul class="nav flex-column">
            <li class="nav-item">
              <a class="nav-link" href="dashboard.html"><i class="fas fa-tachometer-alt me-2"></i> Dashboard</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="services.html"><i class="fas fa-tools me-2"></i> Kelola Layanan</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="orders.html"><i class="fas fa-shopping-cart me-2"></i> Kelola Pesanan</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" href="#"><i class="fas fa-users me-2"></i> Kelola Pengguna</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="reports.html"><i class="fas fa-chart-bar me-2"></i> Laporan</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="../index.html"><i class="fas fa-home me-2"></i> Beranda</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#" onclick="logout()"><i class="fas fa-sign-out-alt me-2"></i> Logout</a>
            </li>
          </ul>
        </div>
      </nav>

      <!-- Main Content -->
      <main class="col-md-9 col-lg-10 main-content">
        <!-- Top Navbar -->
        <nav class="navbar navbar-expand-lg navbar-light bg-white mb-4">
          <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">Kelola Pengguna</span>
            <div class="btn-group">
              <button class="btn btn-outline-primary dropdown-toggle" type="button" data-bs-toggle="dropdown">
                Filter Role
              </button>
              <ul class="dropdown-menu">
                <li><a class="dropdown-item" href="#" onclick="filterUsers('all')">Semua</a></li>
                <li><a class="dropdown-item" href="#" onclick="filterUsers('user')">User</a></li>
                <li><a class="dropdown-item" href="#" onclick="filterUsers('admin')">Admin</a></li>
              </ul>
            </div>
          </div>
        </nav>

        <!-- Users Table -->
        <div class="card">
          <div class="card-header">
            <h5>Daftar Pengguna</h5>
          </div>
          <div class="card-body">
            <table class="table table-striped">
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Nama</th>
                  <th>Email</th>
                  <th>Telepon</th>
                  <th>Role</th>
                  <th>Status</th>
                  <th>Tanggal Daftar</th>
                  <th>Aksi</th>
                </tr>
              </thead>
              <tbody id="usersTableBody">
                <!-- Users will be loaded dynamically -->
              </tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    let allUsers = [];
    let currentFilter = 'all';

    // Load users when page loads
    document.addEventListener('DOMContentLoaded', function() {
      loadUsers();
    });

    async function loadUsers() {
      try {
        const response = await fetch('http://localhost:8000/api/users');
        const users = await response.json();
        allUsers = users;
        displayUsers(users);
      } catch (error) {
        console.error('Error loading users:', error);
        alert('Terjadi kesalahan saat memuat data pengguna');
      }
    }

    function displayUsers(users) {
      const tbody = document.getElementById('usersTableBody');
      tbody.innerHTML = '';

      users.forEach(user => {
        const statusClass = user.status === 'active' ? 'status-active' : 'status-inactive';
        const statusText = user.status === 'active' ? 'Aktif' : 'Tidak Aktif';
        const toggleButtonText = user.status === 'active' ? 'Nonaktifkan' : 'Aktifkan';
        const toggleButtonClass = user.status === 'active' ? 'btn-danger' : 'btn-success';

        const row = `
          <tr>
            <td>${user.id}</td>
            <td>${user.name}</td>
            <td>${user.email}</td>
            <td>${user.phone}</td>
            <td>${user.role === 'admin' ? 'Admin' : 'User'}</td>
            <td><span class="user-status ${statusClass}">${statusText}</span></td>
            <td>${user.joinDate}</td>
            <td>
              <button class="btn btn-sm btn-primary" onclick="viewUser('${user.id}')">Detail</button>
              <button class="btn btn-sm btn-warning" onclick="editUser('${user.id}')">Edit</button>
              <button class="btn btn-sm ${toggleButtonClass}" onclick="toggleUserStatus('${user.id}')">${toggleButtonText}</button>
            </td>
          </tr>
        `;
        tbody.innerHTML += row;
      });
    }

    function viewUser(userId) {
      const user = allUsers.find(u => u.id === userId);
      if (user) {
        alert(`Detail Pengguna:\n\nID: ${user.id}\nNama: ${user.name}\nEmail: ${user.email}\nTelepon: ${user.phone}\nRole: ${user.role}\nStatus: ${user.status}\nTanggal Daftar: ${user.joinDate}`);
      }
    }

    function editUser(userId) {
      const user = allUsers.find(u => u.id === userId);
      if (user) {
        const newName = prompt('Masukkan nama baru:', user.name);
        const newEmail = prompt('Masukkan email baru:', user.email);
        const newPhone = prompt('Masukkan nomor telepon baru:', user.phone);

        if (newName && newEmail && newPhone) {
          updateUser(userId, { name: newName, email: newEmail, phone: newPhone });
        }
      }
    }

    async function updateUser(userId, userData) {
      try {
        const response = await fetch(`http://localhost:8000/api/users/${userId}`, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify(userData)
        });

        if (response.ok) {
          alert('Data pengguna berhasil diperbarui');
          loadUsers(); // Reload users
        } else {
          alert('Gagal memperbarui data pengguna');
        }
      } catch (error) {
        console.error('Error updating user:', error);
        alert('Terjadi kesalahan saat memperbarui data');
      }
    }

    async function toggleUserStatus(userId) {
      const user = allUsers.find(u => u.id === userId);
      if (!user) return;

      const newStatus = user.status === 'active' ? 'inactive' : 'active';
      const confirmMessage = user.status === 'active'
        ? `Apakah Anda yakin ingin menonaktifkan pengguna ${user.name}?`
        : `Apakah Anda yakin ingin mengaktifkan pengguna ${user.name}?`;

      if (confirm(confirmMessage)) {
        try {
          const response = await fetch(`http://localhost:8000/api/users/${userId}/status`, {
            method: 'PUT',
            headers: {
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({ status: newStatus })
          });

          if (response.ok) {
            alert(`Status pengguna berhasil diubah menjadi ${newStatus === 'active' ? 'Aktif' : 'Tidak Aktif'}`);
            loadUsers(); // Reload users
          } else {
            alert('Gagal mengubah status pengguna');
          }
        } catch (error) {
          console.error('Error toggling user status:', error);
          alert('Terjadi kesalahan saat mengubah status');
        }
      }
    }

    function filterUsers(role) {
      currentFilter = role;
      let filteredUsers = allUsers;

      if (role !== 'all') {
        filteredUsers = allUsers.filter(user => user.role === role);
      }

      displayUsers(filteredUsers);
    }

    function logout() {
      if (confirm('Apakah Anda yakin ingin logout?')) {
        localStorage.removeItem('admin');
        window.location.href = '../index.html';
      }
    }
  </script>
</body>
</html>
